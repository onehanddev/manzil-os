[project]
name = "manzil-os"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.8",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
dev = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
